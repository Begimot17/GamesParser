steam:
  enabled: true
  scan_interval: 3600   # seconds, 1 hou
  specials_only: true    # false = scan full catalog (~100k games, takes several hours)

egs:
  enabled: true
  scan_interval: 3600   # seconds, 1 hour

free_games:
  enabled: true
  scan_interval: 3600   # 1 hour
  services:
    gog: false         # GOG catalog of permanently free games — not wanted
    indiegala: false   # IndieGala freebies are permanently free games — not wanted
    gamerpower: true    # aggregator: Epic, GOG, Steam, Ubisoft, EA, Indiegala, Amazon, etc.
