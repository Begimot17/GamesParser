pikabu:
  request_timeout: 30
  max_text_length: 4000
  valid_image_extensions: [".jpg", ".jpeg", ".png", ".gif", ".webp"]
  rate_limit_delay: 2
  initial_pages: 3
  target_urls: "https://pikabu.ru/community/steam"
  selectors:
    articles: "article[data-story-id]"
    title: "a.story__title-link"
    link: "a.story__title-link"
    content: "div.story__content"
    rating: "div.story__rating-count"
    images:
      - "div.story-block_type_image img.story-image__image"
      - "div.story__image img"
      - "img.story__image"
      - "img[src*='story-image']"
      - "img[src*='story__image']"
      - "img[src*='story-block']"
      - "img[data-src]"
    author: "a.story__user-link"
    date: "time.story__datetime"
    tags: "a.story__tag"
    stats: "span.story__views-count" # New stats selector
    store_links: "a[href]"
  stores:
    steam:
      domain: "store.steampowered.com"
      validation_regex: "/app/\\d+/"
    epicgames:
      domain: "epicgames.com"
      validation_regex: "/p/[^/]+$"
    itch:
      domain: "itch.io"
    gog:
      domain: "gog.com"
      validation_regex: "/game/[^/]+$"

vgtimes:
  request_timeout: 30
  max_text_length: 4000
  valid_image_extensions: [".jpg", ".jpeg", ".png", ".gif", ".webp"]
  rate_limit_delay: 2
  initial_pages: 3
  target_urls: "https://vgtimes.ru/free/"
  selectors:
    # Selectors for the list page (https://vgtimes.ru/free/)
    articles: "ul.list-items > li"
    title: "div.item-name.type0 a:first-child"
    link: "div.item-name.type0 a:first-child"
    image: "div.image_wrap.type0 img"
    rating: "div.rrating div.text"
    store_links: 'a.l_ks[target="_blank"]'
    # Date is now extracted from text near the link, selector might describe container/sibling relationship if needed, 
    # but logic will handle text node. Leaving strict selector for now, parser logic will adapt.
    
    # Selectors for the single article page (fallback)
    content: "div.article_block.a_text"
    date: "span.post_date"
  stores:
    steam:
      domain: "store.steampowered.com"
      validation_regex: "/app/\\d+/"
    epicgames:
      domain: "epicgames.com"
      validation_regex: "/p/[^/?#]+"
    gog:
      domain: "gog.com"
      validation_regex: "/game/[^/?#]+"

stopgame:
  request_timeout: 30
  max_text_length: 4000
  valid_image_extensions: [".jpg", ".jpeg", ".png", ".gif", ".webp"]
  rate_limit_delay: 2
  initial_pages: 3
  target_urls: "https://stopgame.ru/news"
  selectors:
    # Using partial class matchers for stability against hash changes
    articles: "div[class*='_card_']"
    title: "a[class*='_title_']"
    link: "a[class*='_title_']"
    image: "a[class*='_image_'] img" # Image is inside the 'image' link container
    # Content requires full page fetch from individual article page
    content: "div[class*='_text_']"
    article_images: "div[class*='_text_'] img"
    # Date is found via specific logic (text node) or partially matched class
    date: "span[class*='_date_']"
  stores:
    steam:
      domain: "store.steampowered.com"
      validation_regex: "/app/\\d+/"
    epicgames:
      domain: "epicgames.com"
      validation_regex: "/p/[^/?#]+"
    gog:
      domain: "gog.com"
      validation_regex: "/game/[^/?#]+"
